name: Sync Discussions to Project Board
on:
  discussion:
    types: [created, edited, answered]

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check Discussion Category
        id: category
        run: |
          CATEGORY="${{ github.event.discussion.category.name }}"
          if [[ "$CATEGORY" =~ ^(Blocked|Client-Resource|PunchList|In Progress|Review)$ ]]; then
            echo "MATCH=true" >> $GITHUB_ENV
          else
            echo "MATCH=false" >> $GITHUB_ENV
          fi

      - name: Create Issue for Matching Discussions
        if: env.MATCH == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const discussion = context.payload.discussion;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Discussion] ${discussion.title}`,
              body: `### Discussion Linked:\n[${discussion.title}](${discussion.html_url})\n\n**Category:** ${discussion.category.name}\n\n**Summary:**\n${discussion.body}`,
              labels: ["discussion-tracking", discussion.category.name]
            });
            console.log(`Created Issue: ${issue.data.html_url}`);
            console.log(`Issue ID: ${issue.data.node_id}`);

            // Store Issue Node ID for next step
            console.log(`::set-output name=issue_id::${issue.data.node_id}`);

  add_to_project:
    needs: create_issue
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue to Project Board
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item {
                  id
                }
              }
            }`;
            
            const variables = {
              projectId: "YOUR_PROJECT_BOARD_ID",
              contentId: "${{ needs.create_issue.outputs.issue_id }}"
            };

            await github.graphql(query, variables);
            console.log("Added Issue to Project Board");

  auto_close:
    runs-on: ubuntu-latest
    steps:
      - name: Close Issue When Discussion is Answered
        if: github.event.action == 'answered'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const discussion = context.payload.discussion;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["discussion-tracking"],
            });

            for (const issue of issues.data) {
              if (issue.body.includes(discussion.html_url)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                console.log(`Closed Issue: ${issue.html_url}`);
              }
            }
